<style>
:root{
  --paper:#F3F5F2; --surface:#FFFFFF; --ink:#16223A; --muted:#5B6476; --line:#D8DCE2;
  --gold:#C98407; --gold-ink:#3A2600; --gold-soft:#FBEFD3;
  --green:#257A49; --green-soft:#E2F1E7; --red:#B3261E; --red-soft:#FBE5E3; --blue-soft:#E7ECF6;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F131B; --surface:#171D29; --ink:#E7EAF1; --muted:#9AA2B4; --line:#2A3242;
    --gold:#F0B43C; --gold-ink:#2A1B00; --gold-soft:#3A2D12;
    --green:#62C38B; --green-soft:#16301F; --red:#F27A71; --red-soft:#3B1C1A; --blue-soft:#1E2738;
  }
}
:root[data-theme="dark"]{
  --paper:#0F131B; --surface:#171D29; --ink:#E7EAF1; --muted:#9AA2B4; --line:#2A3242;
  --gold:#F0B43C; --gold-ink:#2A1B00; --gold-soft:#3A2D12;
  --green:#62C38B; --green-soft:#16301F; --red:#F27A71; --red-soft:#3B1C1A; --blue-soft:#1E2738;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums;}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.ledger{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin-bottom:22px}
.ledger div{padding:14px 16px;border-left:1px solid var(--line)}
.ledger div:first-child{border-left:0}
.ledger span{display:block;color:var(--muted);font-size:13px}
.ledger b{font-family:var(--display);font-size:22px;font-weight:600}
.ledger .cash{background:var(--gold-soft)}
.ledger .cash b{color:var(--ink)}
@media (max-width:820px){.ledger{grid-template-columns:repeat(2,minmax(0,1fr))}.ledger div{border-left:0;border-top:1px solid var(--line)}.ledger div:nth-child(-n+2){border-top:0}.ledger div:nth-child(even){border-left:1px solid var(--line)}.ledger .cash{grid-column:1/-1;border-left:0!important}}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
.bar .hint{color:var(--muted);font-size:13px;margin:2px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:0}
.grid thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-weight:500;font-size:12px;color:var(--muted);padding:8px 2px;text-align:center;min-width:42px}
.grid thead th span{display:block;font-weight:600;color:var(--ink)}
.grid thead th small{font-size:11px}
.grid thead th.now{background:var(--gold-soft)}
.grid thead th.now span{color:var(--gold-ink)}
:root[data-theme="dark"] .grid thead th.now span{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .grid thead th.now span{color:var(--gold)}}
.grid .who{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:10px 14px;min-width:200px;max-width:240px;border-right:1px solid var(--line)}
.grid thead .who{z-index:3;text-align:left;padding-left:14px}
.who .mname{border:0;background:none;padding:0;font-weight:600;font-size:15px;cursor:pointer;text-align:left}
.who .mname:hover{text-decoration:underline}
.who .meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.who .meta .g{color:var(--green);font-weight:600}
.who .meta .r{color:var(--red);font-weight:600}
.who .pay{margin-top:6px}
.grid td{text-align:center}
.grid td.now{background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
.c{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--line);background:none;cursor:pointer;display:inline-grid;place-items:center;font-size:14px;font-weight:700;margin:8px 4px;transition:transform .12s}
.c:hover{transform:scale(1.1)}
.c.paid{background:var(--gold);border:1.5px solid var(--gold);color:var(--gold-ink)}
.c.due{border:1.5px solid var(--red);background:var(--red-soft)}
.grid tfoot td,.grid tfoot th{font-size:11.5px;color:var(--muted);padding:8px 2px;border-bottom:0;background:var(--surface)}
.grid tfoot .who{font-size:13px;color:var(--ink);font-weight:600}

.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:10px 2px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px}

.rtable th,.rtable td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:14px}
.rtable th{font-size:12.5px;color:var(--muted);font-weight:500}
.rtable td.num,.rtable th.num{text-align:right}
.rtable tbody tr{cursor:pointer}
.rtable tbody tr:hover td{background:var(--blue-soft)}
.rtable .bname{font-weight:600}
.rtable small{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.Active{background:var(--blue-soft)}
.pill.Overdue{background:var(--red-soft);color:var(--red)}
.pill.Due{background:var(--gold-soft);color:var(--ink)}
.pill.Closed{background:var(--green-soft);color:var(--green)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dhead h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.dbody{padding:16px 20px;overflow:auto}
.dfoot{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dfoot .right{display:flex;gap:8px;margin-left:auto}
label.f{display:block;margin-bottom:12px;font-size:13.5px;font-weight:500}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.note{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.calc{background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.chips button.full{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-bottom:12px}
.weeks label{border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px;cursor:pointer;text-align:center;user-select:none;background:var(--paper)}
.weeks label b{display:block;font-size:13px}
.weeks input{position:absolute;opacity:0;pointer-events:none}
.weeks label.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.weeks label.was{box-shadow:inset 0 0 0 1px var(--gold)}
.weeks label:focus-within{outline:2px solid var(--ink)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.facts div{background:var(--surface);padding:10px 12px}
.facts span{display:block;font-size:12px;color:var(--muted)}
.facts b{font-size:16px}
@media (max-width:480px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.plist{width:100%;font-size:14px;margin-top:6px}
.plist td{padding:7px 4px;border-bottom:1px solid var(--line)}
.plist td.num{text-align:right}
h4{margin:16px 0 8px;font-size:14px}
.inline{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end}
.inline label.f{margin:0}
@media (max-width:520px){.inline{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
.status{font-size:12.5px;color:var(--muted)}
.ro{background:var(--red-soft);color:var(--red);padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:14px;display:none}
.login{position:fixed;inset:0;background:var(--paper);display:none;place-items:center;z-index:40;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.login.show{display:grid}
.login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.login h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 4px}
.login .err{color:var(--red);font-size:14px;min-height:20px;margin:4px 0 10px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="gname">Chit ledger</h1>
      <p class="sub" id="gsub"></p>
    </div>
    <div class="actions" style="align-items:center">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="chit" aria-selected="true">Chit collection</button>
        <button role="tab" data-tab="rot" aria-selected="false">Rotation</button>
      </div>
      <button class="btn" data-act="backup">Backup</button>
      <button class="btn" data-act="settings">Settings</button>
      <button class="btn" id="signOut" style="display:none">Sign out</button>
    </div>
  </header>

  <div class="ro" id="ro">You can view this ledger but not change it.</div>
  <section class="ledger" id="ledger" aria-label="Summary"></section>
  <main id="view"></main>
  <p class="status" id="status">Loading saved data…</p>
</div>

<section class="login" id="login" aria-label="Sign in">
  <form id="loginForm" novalidate>
    <h2>Chit ledger</h2>
    <p class="sub" style="margin:0 0 16px">Sign in with the admin email and password.</p>
    <label class="f">Email<input id="lEmail" type="email" autocomplete="username" required></label>
    <label class="f">Password<input id="lPass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lErr" role="alert"></p>
    <button class="btn primary" type="submit" id="lBtn" style="width:100%;padding:11px">Sign in</button>
    <p style="text-align:center;margin:14px 0 0"><button type="button" class="linkbtn" id="lReset">Forgot password?</button></p>
  </form>
</section>
<dialog id="dlg"></dialog>
<dialog id="ask"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const WEEKS = 52;
const CAN_DOWNLOAD = true;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Math.round(+n || 0).toLocaleString('en-IN');
const pad = n => String(n).padStart(2,'0');
const toISO = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const today = () => toISO(new Date());
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return toISO(d); };
const addMonths = (s,n) => { const d = parse(s); d.setMonth(d.getMonth()+n); return toISO(d); };
const daysBetween = (a,b) => Math.round((parse(b) - parse(a)) / 86400000);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const short = s => { const d = parse(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const long = s => s ? (short(s) + ' ' + parse(s).getFullYear()) : '—';
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o || {}));

const state = {
  tab: 'chit', rotFilter: 'Active',
  settings: { groupName: 'Our chit group', chitValue: 100, startDate: today() },
  members: {}, rotations: {}
};
let store = null, readOnly = false;

/* ---------- storage: artifact db, with on-device fallback ---------- */
const LKEY = 'chit-ledger-v1';
function localLoad(){
  try { const d = JSON.parse(localStorage.getItem(LKEY) || 'null'); if (d){ Object.assign(state.settings, d.settings||{}); state.members = d.members||{}; state.rotations = d.rotations||{}; } } catch(e){}
}
function localSave(){
  try { localStorage.setItem(LKEY, JSON.stringify({settings: state.settings, members: state.members, rotations: state.rotations})); } catch(e){}
}
function useLocal(msg){
  localLoad();
  store = {
    put: async (c,id,data) => { if (c==='settings') state.settings = data; else state[c][id] = data; localSave(); render(); },
    del: async (c,id) => { delete state[c][id]; localSave(); render(); }
  };
  $('#status').textContent = msg;
  render();
}
async function initStore(){
  const configured = window.firebase && !String(FIREBASE_CONFIG.apiKey).startsWith('PASTE');
  if (!configured) return useLocal('Firebase is not set up yet, so entries are saved on this device only. Add your Firebase config to index.html.');
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), fs = firebase.firestore();
  try { await fs.enablePersistence({ synchronizeTabs: true }); } catch(e){}
  let unsubs = [];
  const stop = () => { unsubs.forEach(u => u()); unsubs = []; };
  /* Writes are applied on screen at once and synced in the background, so the app keeps working with a weak signal. */
  store = {
    put: (c,id,data) => { const p = fs.collection(c).doc(id).set(data); return Promise.race([p, new Promise(r => setTimeout(r, 1500))]).then(() => { p.catch(onLateError); }); },
    del: (c,id) => { const p = fs.collection(c).doc(id).delete(); return Promise.race([p, new Promise(r => setTimeout(r, 1500))]).then(() => { p.catch(onLateError); }); }
  };
  function onLateError(e){ if (e && e.code === 'permission-denied') { setReadOnly(); toast('This account is not allowed to change the ledger.'); } else toast('A change could not be saved. Check your connection.'); }
  const fail = e => {
    if (e && e.code === 'permission-denied'){ $('#status').textContent = 'This email is not on the admin list. Ask the owner to add it in the Firestore rules.'; setReadOnly(); }
    else $('#status').textContent = 'Live sync stopped. Reload the page to reconnect.';
  };
  const login = $('#login'), form = $('#loginForm'), err = $('#lErr'), btn = $('#lBtn');
  auth.onAuthStateChanged(u => {
    stop();
    if (!u){ login.classList.add('show'); $('#signOut').style.display = 'none'; state.members = {}; state.rotations = {}; render(); $('#status').textContent = ''; return; }
    login.classList.remove('show'); $('#signOut').style.display = '';
    readOnly = false; $('#ro').style.display = 'none';
    $('#status').textContent = 'Signed in as ' + u.email + '. Saved online and synced across devices.';
    unsubs.push(fs.doc('settings/main').onSnapshot(s => { if (s.exists) state.settings = Object.assign({groupName:'Our chit group',chitValue:100,startDate:today()}, s.data()); render(); }, fail));
    unsubs.push(fs.collection('members').onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); state.members = m; render(); }, fail));
    unsubs.push(fs.collection('rotations').onSnapshot(s => { const r = {}; s.docs.forEach(d => r[d.id] = d.data()); state.rotations = r; render(); }, fail));
  });
  form.onsubmit = async e => {
    e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing in…';
    try { await auth.signInWithEmailAndPassword($('#lEmail').value.trim(), $('#lPass').value); }
    catch(x){ err.textContent = (x.code === 'auth/invalid-credential' || x.code === 'auth/wrong-password' || x.code === 'auth/user-not-found') ? 'Email or password is wrong.' : x.code === 'auth/too-many-requests' ? 'Too many tries. Wait a few minutes and try again.' : x.code === 'auth/network-request-failed' ? 'No internet connection.' : 'Could not sign in (' + x.code + ').'; }
    btn.disabled = false; btn.textContent = 'Sign in';
  };
  $('#lReset').onclick = async () => {
    const em = $('#lEmail').value.trim();
    if (!em){ err.textContent = 'Type your email above, then tap Forgot password.'; return; }
    try { await auth.sendPasswordResetEmail(em); err.textContent = ''; toast('Password reset email sent to ' + em); }
    catch(x){ err.textContent = 'Could not send the reset email (' + x.code + ').'; }
  };
  $('#signOut').onclick = async () => { if (await ask('Sign out of the chit ledger on this device?', 'Sign out')) auth.signOut(); };
}
function setReadOnly(){ readOnly = true; $('#ro').style.display = 'block'; render(); }
async function save(c, id, data){
  if (readOnly) return false;
  try { await store.put(c, id, data); return true; }
  catch(e){
    if (e && (e.code === 'invalid_argument' || e.code === 'permission-denied')){ setReadOnly(); toast('You don\'t have permission to change this ledger.'); }
    else if (e && e.code === 'quota_exceeded') toast('Storage is full. Delete closed rotations to free space.');
    else toast('Couldn\'t save. Check your connection and try again.');
    return false;
  }
}
async function remove(c, id){
  if (readOnly) return false;
  try { await store.del(c, id); return true; } catch(e){ toast('Couldn\'t delete. Try again.'); return false; }
}

/* ---------- chit maths ---------- */
const val = () => +state.settings.chitValue || 0;
const weekStart = w => addDays(state.settings.startDate, (w-1)*7);
function currentWeek(){
  const d = daysBetween(state.settings.startDate, today());
  if (d < 0) return 0;
  return Math.min(WEEKS, Math.floor(d/7) + 1);
}
function memberCalc(m){
  const per = (+m.chits || 0) * val();
  const paidWeeks = Object.keys(m.paid || {}).map(Number);
  const cw = currentWeek();
  let dueWeeks = 0;
  for (let w = 1; w <= cw; w++) if (!(m.paid||{})[w]) dueWeeks++;
  return { per, paidWeeks: paidWeeks.length, paid: paidWeeks.length * per, dueWeeks, due: dueWeeks * per, full: WEEKS * per };
}
function monthsOfYear(){
  const groups = [];
  for (let w = 1; w <= WEEKS; w++){
    const d = parse(weekStart(w)); const key = d.getFullYear() + '-' + d.getMonth();
    let g = groups[groups.length-1];
    if (!g || g.key !== key){ g = {key, label: MON[d.getMonth()] + ' ' + d.getFullYear(), weeks: []}; groups.push(g); }
    g.weeks.push(w);
  }
  return groups;
}

/* ---------- rotation maths ---------- */
const PERIOD = {
  week:  { days: 7,  one: 'week',  many: 'weeks', adj: 'Weekly' },
  month: { days: 30, one: 'month', many: 'months', adj: 'Monthly' }
};
const per = r => PERIOD[r.period] || PERIOD.month;
/* Interest is charged per completed period (week or month) on the balance principal.
   If principal comes back part-way through a period, that period is split by days. */
function rotCalc(r){
  const P = per(r), pdays = P.days;
  const pays = [...(r.payments||[])].sort((a,b) => a.date.localeCompare(b.date));
  const rate = (+r.rate || 0) / 100;
  const stop = r.closed && r.closedDate ? r.closedDate : today();
  const elapsed = Math.max(0, daysBetween(r.givenDate, stop));
  const periodsDone = Math.floor(elapsed / pdays);
  const end = addDays(r.givenDate, periodsDone * pdays);   // last completed period boundary
  let out = +r.amount || 0, accrued = 0, last = r.givenDate;
  for (const p of pays){
    if (p.kind !== 'principal') continue;
    const d = p.date < end ? p.date : end;
    if (d > last){ accrued += Math.max(0,out) * rate * daysBetween(last, d) / pdays; last = d; }
    out -= +p.amount || 0;
  }
  if (end > last) accrued += Math.max(0,out) * rate * daysBetween(last, end) / pdays;
  const balanceNow = Math.max(0, (+r.amount||0) - pays.filter(p => p.kind==='principal' && p.date <= stop).reduce((s,p)=>s+(+p.amount||0),0));
  const nextDue = r.closed ? null : addDays(r.givenDate, (periodsDone + 1) * pdays);
  const interestPaid = pays.filter(p => p.kind === 'interest').reduce((s,p) => s + (+p.amount||0), 0);
  const principalPaid = pays.filter(p => p.kind === 'principal').reduce((s,p) => s + (+p.amount||0), 0);
  let status = 'Active';
  const left = r.dueDate ? daysBetween(today(), r.dueDate) : null;
  if (r.closed) status = 'Closed';
  else if (left !== null && left < 0) status = 'Overdue';
  else if (left !== null && left <= 7) status = 'Due soon';
  return {
    balance: Math.max(0, out), accrued, interestPaid, principalPaid,
    interestDue: Math.max(0, accrued - interestPaid),
    perPeriod: (+r.amount||0) * rate, nextPeriodAmt: balanceNow * rate,
    periodsDone, nextDue, P, status, left
  };
}

function totals(){
  let chitPaid = 0, chitDue = 0, given = 0, out = 0, intPaid = 0, prinPaid = 0, intDue = 0;
  Object.values(state.members).forEach(m => { const c = memberCalc(m); chitPaid += c.paid; chitDue += c.due; });
  Object.values(state.rotations).forEach(r => {
    const c = rotCalc(r); given += +r.amount || 0; intPaid += c.interestPaid; prinPaid += c.principalPaid;
    if (!r.closed){ out += c.balance; intDue += c.interestDue; }
  });
  return { chitPaid, chitDue, given, out, intPaid, prinPaid, intDue, cash: chitPaid - given + prinPaid + intPaid };
}

      <div><span>Interest due so far (${c.periodsDone} ${c.periodsDone===1?c.P.one:c.P.many})</span><b>${money(c.accrued)}</b></div>
      <div><span>Interest collected</span><b style="color:var(--green)">${money(c.interestPaid)}</b></div>
      <div><span>Interest pending</span><b style="color:${c.interestDue>0.5?'var(--red)':'inherit'}">${money(c.interestDue)}</b></div>
      <div><span>Principal returned</span><b>${money(c.principalPaid)}</b></div>
      <div><span>Balance to return</span><b>${money(c.balance)}</b></div>
      <div><span>Status</span><b><span class="pill ${c.status.split(' ')[0]}">${c.status}</span></b></div>
    </div>
    ${c.nextDue ? `<div class="calc">Rate ₹${+r.rate} per ₹100 per ${c.P.one}. Next interest of <b>${money(c.nextPeriodAmt)}</b> is due on <b>${long(c.nextDue)}</b>.</div>` : ''}
    ${r.closed ? '' : `<h4>Record money received</h4>
    <div class="inline">
      <label class="f">Date<input id="xDate" type="date" value="${today()}"></label>
      <label class="f">Amount (₹)<input id="xAmt" type="number" min="1" inputmode="numeric" value="${Math.round(c.interestDue) || ''}"></label>
      <label class="f">Type<select id="xKind"><option value="interest">Interest</option><option value="principal">Principal returned</option></select></label>
      <button class="btn gold" data-act="addPay" data-id="${id}" data-edit>Add</button>
    </div>`}
    <h4>Received so far</h4>
    ${pays.length ? `<table class="plist">${pays.map(p => `<tr><td>${long(p.date)}</td><td>${p.kind === 'interest' ? 'Interest' : 'Principal'}</td><td class="num">${money(p.amount)}</td><td class="num"><button class="btn small danger" data-act="delPay" data-id="${id}" data-p="${p.id}" data-edit aria-label="Delete this entry">Delete</button></td></tr>`).join('')}</table>` : '<p class="note">Nothing received yet.</p>'}`,
    `<button class="btn danger" data-act="delRot" data-id="${id}" data-edit>Delete</button>
     <div class="right"><button class="btn" data-act="editRot" data-id="${id}" data-edit>Edit</button>
     <button class="btn primary" data-act="closeRot" data-id="${id}" data-edit>${r.closed ? 'Reopen' : 'Mark as closed'}</button></div>`);
  dlg.dataset.rot = id;
}
async function addPay(id){
  const amount = +$('#xAmt').value;
  if (!(amount > 0)){ toast('Enter the amount received'); return; }
  const doc = clone(state.rotations[id]);
  doc.payments = doc.payments || [];
  doc.payments.push({ id: uid('p'), date: $('#xDate').value || today(), amount, kind: $('#xKind').value });
  if (await save('rotations', id, doc)){ toast(money(amount) + ' recorded'); state.rotations[id] = doc; rotDetail(id); }
}


/* ---------- backup / restore ---------- */
function backupDlg(){
  const data = JSON.stringify({ app: 'chit-ledger', version: 1, exportedAt: new Date().toISOString(), settings: state.settings, members: state.members, rotations: state.rotations });
  const nm = Object.keys(state.members).length, nr = Object.keys(state.rotations).length;
  openDlg('Backup and restore', `
    <h4 style="margin-top:0">Save a backup</h4>
    <p class="note" style="margin-top:0">Contains ${nm} member${nm===1?'':'s'} and ${nr} rotation${nr===1?'':'s'}. Keep a copy somewhere safe, for example once a month.</p>
    <div class="actions" style="margin-bottom:10px">
      ${CAN_DOWNLOAD ? '<button class="btn primary" id="bDown">Download backup file</button>' : ''}
      <button class="btn" id="bCopy">Copy backup text</button>
    </div>
    <label class="f">Backup text<textarea id="bText" rows="4" readonly>${esc(data)}</textarea></label>
    <h4>Restore from a backup</h4>
    <p class="note" style="margin-top:0">Restoring brings back the settings, members and rotations from the backup. Entries with the same name in both stay as the backup version; other entries are kept.</p>
    <label class="f">Backup file<input type="file" id="bFile" accept=".json,application/json,text/plain"></label>
    <label class="f">Or paste backup text<textarea id="bPaste" rows="4" placeholder='{"app":"chit-ledger", ...}'></textarea></label>`,
    `<div class="right"><button class="btn" data-act="close">Close</button><button class="btn gold" id="bRestore" data-edit ${readOnly?'disabled':''}>Restore backup</button></div>`);
  $('#bCopy').onclick = async () => {
    const t = $('#bText');
    try { await navigator.clipboard.writeText(t.value); toast('Backup text copied'); }
    catch(e){ t.focus(); t.select(); try { document.execCommand('copy'); toast('Backup text copied'); } catch(_){ toast('Select the text and copy it'); } }
  };
  if (CAN_DOWNLOAD) $('#bDown').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
    a.download = 'chit-ledger-backup-' + today() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup downloaded');
  };
  $('#bFile').onchange = async e => { const f = e.target.files[0]; if (f) $('#bPaste').value = await f.text(); };
  $('#bRestore').onclick = async () => {
    let d;
    try { d = JSON.parse($('#bPaste').value); } catch(e){ toast('Choose a backup file or paste the backup text first'); return; }
    if (!d || d.app !== 'chit-ledger' || typeof d.members !== 'object' || typeof d.rotations !== 'object'){ toast('This is not a chit ledger backup'); return; }
    const m = Object.keys(d.members).length, r = Object.keys(d.rotations).length;
    if (!(await ask(`Restore ${m} member${m===1?'':'s'} and ${r} rotation${r===1?'':'s'} from this backup?`, 'Restore'))) return;
    $('#bRestore').disabled = true; $('#bRestore').textContent = 'Restoring…';
    let ok = true;
    if (d.settings) ok = await save('settings', 'main', d.settings) && ok;
    for (const [id, v] of Object.entries(d.members)) ok = (await save('members', id, v)) && ok;
    for (const [id, v] of Object.entries(d.rotations)) ok = (await save('rotations', id, v)) && ok;
    closeDlg();
    toast(ok ? 'Backup restored' : 'Some entries could not be restored. Try again.');
  };
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]');
  if (tab){ state.tab = tab.dataset.tab; scrolledOnce = false; render(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const id = el.dataset.id, act = el.dataset.act;
  if (readOnly && el.hasAttribute('data-edit')) return;
  switch(act){
    case 'close': closeDlg(); break;
    case 'settings': settingsDlg(); break;
    case 'backup': backupDlg(); break;
    case 'saveSettings': saveSettings(); break;
    case 'addMember': memberDlg(); break;
    case 'editMember': memberDlg(id); break;
    case 'saveMember': saveMember(id); break;
    case 'delMember': {
      const m = state.members[id];
      if (await ask(`Delete <b>${esc(m.name)}</b> and all their chit payments? This can't be undone.`, 'Delete member')){ if (await remove('members', id)){ closeDlg(); toast('Member deleted'); } }
      break; }
    case 'pay': payDlg(id); break;
    case 'toggle': toggleWeek(id, +el.dataset.w); break;
    case 'rfilter': state.rotFilter = el.dataset.f; render(); break;
    case 'addRot': rotDlg(); break;
    case 'editRot': rotDlg(id); break;
    case 'saveRot': saveRot(id); break;
    case 'openRot': rotDetail(id); break;
    case 'addPay': addPay(id); break;
    case 'delPay': {
      if (!(await ask('Delete this entry?', 'Delete'))) break;
      const doc = clone(state.rotations[id]); doc.payments = (doc.payments||[]).filter(p => p.id !== el.dataset.p);
      if (await save('rotations', id, doc)){ state.rotations[id] = doc; rotDetail(id); toast('Entry deleted'); }
      break; }
    case 'closeRot': {
      const doc = clone(state.rotations[id]); const c = rotCalc(doc);
      if (!doc.closed && (c.balance > 0 || c.interestDue > 0.5)){
        if (!(await ask(`${esc(doc.name)} still owes ${money(c.balance)} principal and ${money(c.interestDue)} interest. Close anyway?`, 'Close rotation'))) break;
      }
      doc.closed = !doc.closed; doc.closedDate = doc.closed ? today() : null;
      if (await save('rotations', id, doc)){ state.rotations[id] = doc; rotDetail(id); toast(doc.closed ? 'Rotation closed' : 'Rotation reopened'); }
      break; }
    case 'delRot': {
      const r = state.rotations[id];
      if (await ask(`Delete the rotation for <b>${esc(r.name)}</b> with all its entries? This can't be undone.`, 'Delete')){ if (await remove('rotations', id)){ closeDlg(); toast('Rotation deleted'); } }
      break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('tr[data-act="openRot"]')) rotDetail(e.target.dataset.id);
});

render();
initStore();
})();
</script>
</body>
</html>
